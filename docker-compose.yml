# ══════════ 生产编排（app + worker + migrate；PG/Redis 用外部实例）══════════
# 部署形态：1Panel 自托管——数据库与缓存复用 1Panel 已部署的容器实例，
# 本 compose 只包含无状态应用服务，升级重建（up -d --build）不触碰任何数据。
#
# 连通方式：应用容器加入 1Panel 的 docker 网络（默认 1panel-network，
# 可用 .env 的 PANEL_NETWORK 覆盖），连接串直接用 1Panel 容器名做 host——
# PG/Redis 无需对宿主机暴露端口。
#
# 用法：
#   1. cp .env.example .env 并修改：
#      - DATABASE_URL（注意末尾要带 /库名）、REDIS_URL、密钥四项
#   2. docker compose up -d --build
#   3. 首次/升级执行迁移：docker compose run --rm migrate
#   4. 首次种子超管：docker compose run --rm migrate npx tsx src/db/seed.ts
#
# 本地开发基础设施（自带 PG/Redis）见 docker-compose.dev.yml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 镜像源默认国内（DaoCloud / npmmirror），海外部署在 .env 覆盖为官方源
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: hanxing-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-瀚星 Super Image}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_BASE_URL: ${COS_BASE_URL:-}
      COS_IMAGE_PREFIX: ${COS_IMAGE_PREFIX:-image/}
      CRON_SECRET: ${CRON_SECRET}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-2000}
      WORKER_TASK_CONCURRENCY: ${WORKER_TASK_CONCURRENCY:-8}
      # app 进程内 after() 后台任务（样机素材中转等）也走存储层下载信号量
      TRANSFER_CONCURRENCY: ${TRANSFER_CONCURRENCY:-16}
      # /uploads 收紧宽限期（未配置 = 一直宽限，仅日志计数；设为已过去日期立即强制）
      UPLOADS_UNSIGNED_GRACE_END: ${UPLOADS_UNSIGNED_GRACE_END:-}
    volumes:
      - uploads:/app/uploads
    networks:
      - default
      - panel

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: hanxing-migrate
    restart: "no"
    command: ["npx", "drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # seed（docker compose run --rm migrate npx tsx src/db/seed.ts）也要
      # 读超管账号；密钥让 env.ts 校验安静通过（dev 模式缺失仅 warn）
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      REDIS_URL: ${REDIS_URL}
    networks:
      - default
      - panel
    profiles:
      - migrate

  worker:
    # 队列消费者进程：周期性消费 Redis 里的生图任务，与 Web 进程解耦
    # （AI 生图是长耗时 IO 密集任务，独立进程避免拖累用户请求响应）。
    # 复用 builder 阶段镜像（含完整 node_modules + 源码），与 migrate 一致。
    #
    # 水平扩容：WORKER_REPLICAS=N docker compose up -d（或 docker compose up -d --scale worker=N）。
    # 不能设 container_name——固定容器名与多副本互斥。跨副本总并发由 Redis
    # 企业/模型槽位协调，ZREM 原子出队防重复消费，无需额外协调组件。
    # 总 PG 连接数 = N × DB_POOL_MAX + web 10，超出时在 1Panel 侧调大
    # PostgreSQL 的 max_connections。
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    command: ["npx", "tsx", "scripts/worker.ts"]
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_BASE_URL: ${COS_BASE_URL:-}
      COS_IMAGE_PREFIX: ${COS_IMAGE_PREFIX:-image/}
      CRON_SECRET: ${CRON_SECRET}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-2000}
      WORKER_TASK_CONCURRENCY: ${WORKER_TASK_CONCURRENCY:-8}
      # 转存下载并发上限（防入方向带宽打满导致 30s 下载超时雪崩；按实测带宽调整）
      TRANSFER_CONCURRENCY: ${TRANSFER_CONCURRENCY:-16}
      # 订阅周期发放扫描间隔（worker.ts 直读 process.env，缺省 60s）
      SUBSCRIPTION_POLL_INTERVAL_MS: ${SUBSCRIPTION_POLL_INTERVAL_MS:-60000}
      # worker 进程专属：DB 池随单进程任务并发放大（web 进程保持默认 10）
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-30}
    networks:
      - default
      - panel

networks:
  # 1Panel 应用默认网络：应用容器经它用容器名直连 1Panel 的 PG/Redis。
  # 名称不对时用 docker inspect <pg容器名> --format '{{json .NetworkSettings.Networks}}' 查实际网络，
  # 并在 .env 里设 PANEL_NETWORK 覆盖。
  panel:
    name: ${PANEL_NETWORK:-1panel-network}
    external: true

volumes:
  uploads:
